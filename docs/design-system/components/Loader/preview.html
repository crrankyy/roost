<!-- @dsCard group="Feedback" height=130 subtitle="16 · 24 · 40px · in a status line · in buttons" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Loader — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 28, alignItems: 'center', flexWrap: 'wrap' } },
    h(K.Loader, null),
    h(K.Loader, { style: { width: 24, height: 24 } }),
    h(K.Loader, { style: { width: 40, height: 40 } }),
    h('span', { style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--muted-foreground)' } }, h(K.Loader, null), 'Fetching sources'),
    h(K.Button, { disabled: true }, h(K.Loader, null), 'Running agent'),
    h(K.Button, { variant: 'outline' }, h(K.Loader, null), 'Syncing')));
</script>
</body>
</html>

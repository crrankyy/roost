<!-- @dsCard group="Data display" height=80 subtitle="default (model) · secondary · outline · destructive" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'center' } },
    h(K.Badge, null, 'Claude 3.5 Sonnet'),
    h(K.Badge, null, h(I.Sparkles), 'Running'),
    h(K.Badge, { variant: 'secondary' }, 'Draft'),
    h(K.Badge, { variant: 'outline' }, h(I.Shield), 'Read only'),
    h(K.Badge, { variant: 'destructive' }, h(I.AlertTriangle), 'Failed')));
</script>
</body>
</html>

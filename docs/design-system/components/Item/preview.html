<!-- @dsCard group="Data display" height=380 subtitle="outline · muted · default; icon media and actions" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Item — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  function agent(variant, icon, title, desc, action) {
    return h(K.Item, { variant: variant },
      h(K.ItemMedia, { variant: 'icon' }, h(icon)),
      h(K.ItemContent, null, h(K.ItemTitle, null, title), h(K.ItemDescription, null, desc)),
      h(K.ItemActions, null, action));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 560 } },
    agent('outline', I.Brain, 'Research agent', 'Reads the web and your notes, drafts cited summaries.', h(K.Button, { size: 'sm', variant: 'outline' }, 'Open')),
    agent('muted', I.Inbox, 'Inbox agent', 'Paused · resumes tomorrow at 9:00', h(K.Button, { size: 'sm', variant: 'ghost' }, h(I.Play), 'Resume')),
    h(K.ItemGroup, null,
      agent('default', I.Calendar, 'Calendar agent', 'Can read and write your calendar', h(K.Badge, { variant: 'secondary' }, 'Write')),
      h(K.ItemSeparator, null),
      agent('default', I.Terminal, 'Coding agent', 'Opened a draft pull request', h(K.Badge, null, 'Running')))));
</script>
</body>
</html>

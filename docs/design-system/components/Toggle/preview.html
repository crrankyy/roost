<!-- @dsCard group="Actions" height=144 subtitle="default · outline · on/off · sizes · disabled" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toggle — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.cap{font-size:12px;color:var(--muted-foreground)}.shell{border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--card) 75%,transparent);box-shadow:var(--shadow-lg)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col', style: { gap: 16 } },
    h('div', { className: 'row' },
      h(K.Toggle, { defaultPressed: true, 'aria-label': 'Web search' }, h(I.Globe), 'Web search'),
      h(K.Toggle, { 'aria-label': 'Deep thinking' }, h(I.Brain), 'Deep thinking'),
      h(K.Toggle, { defaultPressed: true, 'aria-label': 'Pin to sidebar' }, h(I.Zap)),
      h(K.Toggle, { 'aria-label': 'Mute notifications' }, h(I.Bell))),
    h('div', { className: 'row' },
      h(K.Toggle, { variant: 'outline', defaultPressed: true }, h(I.Wrench), 'Tools'),
      h(K.Toggle, { variant: 'outline' }, h(I.Shield), 'Ask first'),
      h(K.Toggle, { variant: 'outline', size: 'sm', defaultPressed: true }, 'Memory on'),
      h(K.Toggle, { variant: 'outline', size: 'lg' }, h(I.Terminal), 'Shell'),
      h(K.Toggle, { variant: 'outline', disabled: true }, h(I.Mail), 'Send email'))));
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alert — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 560 } },
    h(K.Alert, null, h(I.Shield),
      h(K.AlertTitle, null, 'Inbox agent needs permission'),
      h(K.AlertDescription, null, 'Allow it to send replies on your behalf, or keep it in draft-only mode.')),
    h(K.Alert, { variant: 'destructive' }, h(I.AlertTriangle),
      h(K.AlertTitle, null, 'Run failed'),
      h(K.AlertDescription, null, 'The coding agent lost access to the repository. Reconnect GitHub and retry.'))));
</script>
</body>
</html>

<!-- @dsCard group="Forms" height=222 subtitle="settings rows: on · off · disabled" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.cap{font-size:12px;color:var(--muted-foreground)}.shell{border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--card) 75%,transparent);box-shadow:var(--shadow-lg)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  function Row(id, label, hint, p) { return h('div', { className: 'row', style: { justifyContent: 'space-between', gap: 24, padding: '10px 0', borderBottom: '1px solid color-mix(in srgb,var(--border) 50%,transparent)' } },
    h('div', { className: 'col', style: { gap: 4 } }, h(K.Label, { htmlFor: id }, label), h('span', { className: 'cap' }, hint)),
    h(K.Switch, Object.assign({ id: id }, p))) }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { maxWidth: 480 } },
    Row('s1', 'Web browsing', 'Agents may open pages to answer you.', { defaultChecked: true }),
    Row('s2', 'Long-term memory', 'Remember preferences across chats.', {}),
    Row('s3', 'Run on a schedule', 'Upgrade your plan to enable.', { disabled: true })));
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BudgetStack — preview</title>
<link rel="stylesheet" href="../reports.css"><style>body.lr-report{padding:24px;min-height:0}</style>
</head>
<body class="lr-report">
<div class="lr-stack" role="list">
  <div class="lr-layer" role="listitem"><span class="lr-num">1</span><div><div class="lr-layer-name">Instructions</div><div class="lr-layer-sub">Change rarely</div></div><div><div class="lr-bar"><span style="width:19%"></span></div><div class="lr-bar-label">~1.5k</div></div></div>
  <div class="lr-layer" role="listitem"><span class="lr-num">2</span><div><div class="lr-layer-name">Reflections, then observations</div><div class="lr-layer-sub">When the observer runs</div></div><div><div class="lr-bar"><span style="width:75%"></span></div><div class="lr-bar-label">~6k</div></div></div>
  <div class="lr-layer" role="listitem"><span class="lr-num">3</span><div><div class="lr-layer-name">Recent turns, word for word</div><div class="lr-layer-sub">Appended each turn</div></div><div><div class="lr-bar"><span style="width:100%"></span></div><div class="lr-bar-label">~8k</div></div></div>
  <div class="lr-divider">cached above · changes every turn below</div>
  <div class="lr-layer" data-volatile role="listitem"><span class="lr-num">4</span><div><div class="lr-layer-name">Date, time and search matches</div><div class="lr-layer-sub">Only when the top match clearly wins</div></div><div><div class="lr-bar"><span style="width:38%"></span></div><div class="lr-bar-label">~3k</div></div></div>
</div>
</body>
</html>

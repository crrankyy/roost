<!-- @dsCard group="Forms" height=280 subtitle="search with kbd · URL prefix + button · composer with block-end actions" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>InputGroup — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.cap{font-size:12px;color:var(--muted-foreground)}.shell{border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--card) 75%,transparent);box-shadow:var(--shadow-lg)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col', style: { gap: 16, maxWidth: 560 } },
    h('div', { className: 'row', style: { flexWrap: 'nowrap' } },
      h(K.InputGroup, null,
        h(K.InputGroupInput, { placeholder: 'Search agents and runs', 'aria-label': 'Search' }),
        h(K.InputGroupAddon, null, h(I.Search)),
        h(K.InputGroupAddon, { align: 'inline-end' }, h(K.Kbd, null, '⌘K'))),
      h(K.InputGroup, null,
        h(K.InputGroupAddon, null, h(K.InputGroupText, null, 'https://')),
        h(K.InputGroupInput, { defaultValue: 'arxiv.org/list/cs.AI', 'aria-label': 'Source URL', style: { paddingLeft: 2 } }),
        h(K.InputGroupAddon, { align: 'inline-end' }, h(K.InputGroupButton, null, 'Add')))),
    h(K.InputGroup, null,
      h(K.InputGroupTextarea, { placeholder: 'Message your AI agent...', 'aria-label': 'Message', style: { minHeight: 72 } }),
      h(K.InputGroupAddon, { align: 'block-end' },
        h(K.InputGroupButton, { variant: 'outline', size: 'icon-sm', 'aria-label': 'Attach file' }, h(I.FilePlus2)),
        h(K.InputGroupButton, { variant: 'outline', size: 'icon-sm', 'aria-label': 'Voice input' }, h(I.Mic)),
        h(K.InputGroupText, { style: { fontSize: 12 } }, 'AI agent input'),
        h(K.InputGroupButton, { variant: 'default', size: 'icon-sm', 'aria-label': 'Send message', style: { marginLeft: 'auto' } }, h(I.ArrowUp)))),
    h(K.InputGroup, { 'data-disabled': 'true' },
      h(K.InputGroupAddon, null, h(I.Shield)),
      h(K.InputGroupInput, { disabled: true, defaultValue: 'Managed by workspace policy', 'aria-label': 'API key' }))));
</script>
</body>
</html>

<!-- @dsCard group="Actions" height=156 subtitle="single mode switch · multiple formatting · outline" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ToggleGroup — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.cap{font-size:12px;color:var(--muted-foreground)}.shell{border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--card) 75%,transparent);box-shadow:var(--shadow-lg)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col', style: { gap: 16 } },
    h('div', { className: 'row', style: { gap: 24 } },
      h(K.ToggleGroup, { type: 'single', defaultValue: 'agent', 'aria-label': 'Conversation mode' },
        h(K.ToggleGroupItem, { value: 'chat' }, h(I.Inbox), 'Chat'),
        h(K.ToggleGroupItem, { value: 'agent' }, h(I.Bot), 'Agent'),
        h(K.ToggleGroupItem, { value: 'research' }, h(I.Search), 'Research')),
      h(K.ToggleGroup, { type: 'multiple', size: 'sm', defaultValue: ['bold'], 'aria-label': 'Formatting' },
        h(K.ToggleGroupItem, { value: 'bold', 'aria-label': 'Bold' }, h(I.Bold)),
        h(K.ToggleGroupItem, { value: 'italic', 'aria-label': 'Italic' }, h(I.Italic)),
        h(K.ToggleGroupItem, { value: 'underline', 'aria-label': 'Underline' }, h(I.Underline)))),
    h(K.ToggleGroup, { type: 'single', variant: 'outline', size: 'sm', defaultValue: 'week', 'aria-label': 'Run history range' },
      h(K.ToggleGroupItem, { value: 'day' }, 'Today'),
      h(K.ToggleGroupItem, { value: 'week' }, 'This week'),
      h(K.ToggleGroupItem, { value: 'month' }, 'This month'),
      h(K.ToggleGroupItem, { value: 'all', disabled: true }, 'All time'))));
</script>
</body>
</html>

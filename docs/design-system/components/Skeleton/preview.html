<!doctype html>
<html>
<head><meta charset="utf-8"><title>Skeleton — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 32, alignItems: 'flex-start' } },
    h('div', { style: { display: 'flex', gap: 12, width: 360 } },
      h(K.Skeleton, { style: { width: 32, height: 32, borderRadius: 'var(--radius-xl)', flexShrink: 0 } }),
      h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 8 } },
        h(K.Skeleton, { style: { width: 90, height: 10 } }),
        h(K.Skeleton, { style: { width: '100%', height: 64, borderRadius: 'var(--radius-2xl)' } }),
        h(K.Skeleton, { style: { width: 60, height: 10 } }))),
    h('div', { style: { width: 220, display: 'flex', flexDirection: 'column', gap: 10 } },
      h(K.Skeleton, { style: { width: '100%', height: 96, borderRadius: 'var(--radius-2xl)' } }),
      h(K.Skeleton, { style: { width: '70%', height: 12 } }),
      h(K.Skeleton, { style: { width: '45%', height: 12 } }))));
</script>
</body>
</html>

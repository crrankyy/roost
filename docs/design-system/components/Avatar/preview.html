<!-- @dsCard group="Data display" height=130 subtitle="agent tiles: icon, initials, image, sizes" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Avatar — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  var img = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#b4befe"/><circle cx="20" cy="16" r="7" fill="#1e66f5"/><rect x="8" y="27" width="24" height="14" rx="7" fill="#1e66f5"/></svg>');
  function label(t) { return h('span', { style: { fontSize: 12, color: 'var(--muted-foreground)' } }, t); }
  function col(av, t) { return h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 } }, av, label(t)); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 24, alignItems: 'flex-end' } },
    col(h(K.Avatar, null, h(K.AvatarFallback, null, h(I.Bot, { size: 18 }))), 'Agent'),
    col(h(K.Avatar, null, h(K.AvatarFallback, null, 'RA')), 'Initials'),
    col(h(K.Avatar, null, h(K.AvatarImage, { src: img, alt: 'Dana' }), h(K.AvatarFallback, null, 'DA')), 'Image'),
    col(h(K.Avatar, { style: { width: 32, height: 32 } }, h(K.AvatarFallback, null, h(I.Brain, { size: 16 }))), 'Thread · 32px'),
    col(h(K.Avatar, { style: { width: 24, height: 24 } }, h(K.AvatarFallback, { style: { fontSize: 10 } }, 'IA')), 'Inline · 24px')));
</script>
</body>
</html>

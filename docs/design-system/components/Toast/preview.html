<!-- @dsCard group="Feedback" height=270 subtitle="default via toast() · destructive with action" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  function Demo() {
    React.useEffect(function () {
      K.toast({ title: 'Research agent finished', description: '12 sources reviewed · summary saved to notes',
        action: h(K.ToastAction, { altText: 'Open run' }, 'Open run') });
    }, []);
    return h('div', null,
      h(K.ToastProvider, null,
        h(K.Toast, { variant: 'destructive', open: true, duration: 1e9 },
          h('div', { style: { display: 'grid', gap: 4 } },
            h(K.ToastTitle, null, 'Coding agent stopped'),
            h(K.ToastDescription, null, 'Lost access to the repository.')),
          h(K.ToastAction, { altText: 'Retry run' }, 'Retry'),
          h(K.ToastClose, null)),
        h(K.ToastViewport, { style: { position: 'static', padding: 0 } })),
      h(K.Toaster, null));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

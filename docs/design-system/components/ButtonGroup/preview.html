<!-- @dsCard group="Actions" height=192 subtitle="outline run controls · split default · text + input · vertical" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ButtonGroup — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.cap{font-size:12px;color:var(--muted-foreground)}.shell{border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--card) 75%,transparent);box-shadow:var(--shadow-lg)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row', style: { alignItems: 'flex-start', gap: 32 } },
    h('div', { className: 'col', style: { gap: 16 } },
      h(K.ButtonGroup, { 'aria-label': 'Run controls' },
        h(K.Button, { variant: 'outline' }, h(I.Play), 'Run'),
        h(K.Button, { variant: 'outline' }, h(I.Clock), 'Schedule'),
        h(K.Button, { variant: 'outline', size: 'icon', 'aria-label': 'More run options' }, h(I.MoreHorizontal))),
      h(K.ButtonGroup, { 'aria-label': 'Start research agent' },
        h(K.Button, null, 'Start research'),
        h(K.ButtonGroupSeparator),
        h(K.Button, { size: 'icon', 'aria-label': 'Choose agent' }, h(I.ChevronDown))),
      h(K.ButtonGroup, { 'aria-label': 'Add source' },
        h(K.ButtonGroupText, null, h(I.Globe), 'https://'),
        h(K.Input, { defaultValue: 'docs.lynx.ai/agents', 'aria-label': 'Source URL', style: { width: 200 } }),
        h(K.Button, { variant: 'outline' }, 'Add source'))),
    h(K.ButtonGroup, { orientation: 'vertical', 'aria-label': 'Run actions' },
      h(K.Button, { variant: 'outline', size: 'icon', 'aria-label': 'Resume run' }, h(I.Play)),
      h(K.Button, { variant: 'outline', size: 'icon', 'aria-label': 'Pause run' }, h(I.Pause)),
      h(K.Button, { variant: 'outline', size: 'icon', 'aria-label': 'Delete run' }, h(I.Trash2)))));
</script>
</body>
</html>

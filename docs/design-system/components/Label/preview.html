<!-- @dsCard group="Forms" height=182 subtitle="above a field · beside a checkbox · disabled peer" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Label — preview</title>
<style>html,body{margin:0}body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:24px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.cap{font-size:12px;color:var(--muted-foreground)}.shell{border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--card) 75%,transparent);box-shadow:var(--shadow-lg)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var K = window.Lynx, h = React.createElement, I = K.Icons;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col', style: { gap: 20, maxWidth: 360 } },
    h('div', { className: 'col' }, h(K.Label, { htmlFor: 'l1' }, 'Agent name'), h(K.Input, { id: 'l1', placeholder: 'Calendar agent' })),
    h('div', { className: 'row', style: { gap: 8 } }, h(K.Checkbox, { id: 'l2', defaultChecked: true }), h(K.Label, { htmlFor: 'l2' }, 'Let the agent read my calendar')),
    h('div', { className: 'row', style: { gap: 8 } }, h(K.Checkbox, { id: 'l3', disabled: true }), h(K.Label, { htmlFor: 'l3' }, 'Let the agent send invites (admin only)'))));
</script>
</body>
</html>
